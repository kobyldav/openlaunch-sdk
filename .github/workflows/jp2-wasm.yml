name: JP2 OpenJPEG WASM Integration

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  real-openjpeg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Keep the codec separate from required runtime dependencies. Pin its version
      # to make the real WASM decoder smoke reproducible in this workflow.
      - name: Install optional OpenJPEG codec for real decode test
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @cornerstonejs/codec-openjpeg@1.3.6
      - name: Verify actual OpenJPEG WASM SCL pixel values
        run: node scripts/jp2-openjpeg-real-smoke.mjs
