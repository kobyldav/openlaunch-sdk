name: CI

on:
  push:
    branches: ["main", "master", "feature/terrain-reconstruction"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate npm release graph without publishing
        run: node scripts/release-npm.mjs --plan
      - run: npm run check
      - name: Audit all public runtime exports and examples
        run: node scripts/api-surface-audit.mjs --output=test-results/ci-api
      - name: Preserve API coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory-node-${{ matrix.node }}
          path: test-results/ci-api
      - name: Execute all catalogued offline TypeScript examples
        run: node scripts/verify-cookbook.mjs --mode=offline --output=test-results/ci-cookbook
      - run: npm pack --dry-run
      - run: npm run pack:check:packages
      - run: npm run test:packed

  terrain-demo-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run example:terrain
      - run: node scripts/terrain-source-demo.mjs --source aerial
      - name: Calibrated synthetic aerial SGM (perspective cameras)
        run: node scripts/terrain-aerial-demo.mjs --matcher sgm --out test-results/terrain-aerial-sgm
      - name: Urban roof/discontinuity synthetic SGM benchmark
        run: node scripts/terrain-benchmark.mjs --offline --case urban --matcher sgm --out test-results/terrain-urban-sgm
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-demo-windows
          path: |
            test-results/terrain-demo/
            test-results/terrain-aerial/
            test-results/terrain-aerial-sgm/
            test-results/terrain-urban-sgm/
            test-results/terrain-sources.html

  terrain-real-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run example:terrain-real -- --size 32
      - name: Higher density stereo check (same 960 m area)
        run: node scripts/terrain-real-demo.mjs --size 64 --resolution 15 --out test-results/terrain-real-detail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-real-windows
          path: |
            test-results/terrain-real/report.json
            test-results/terrain-real/terrain.html
            test-results/terrain-real/terrain.obj
            test-results/terrain-real/heights.csv
            test-results/terrain-real-detail/report.json
            test-results/terrain-real-detail/terrain.html

  terrain-benchmark-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run terrain test matrix (including expected rejection cases)
        run: node scripts/terrain-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-benchmark
          path: |
            test-results/terrain-benchmark/index.html
            test-results/terrain-benchmark/summary.*
            test-results/terrain-benchmark/*/report.json
            test-results/terrain-benchmark/*/terrain.html

  terrain-large-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Large actual satellite triplet, tiled 128x128 DSM
        run: node scripts/terrain-benchmark.mjs --case s2p-triplet-large --out test-results/terrain-large
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-large-windows
          path: |
            test-results/terrain-large/index.html
            test-results/terrain-large/summary.*
            test-results/terrain-large/s2p-triplet-large/report.json
            test-results/terrain-large/s2p-triplet-large/terrain.html

  terrain-sgm-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build SDK
        run: npm run build
      - name: Compare independent native SGM and height-sweep methods on real stereo
        run: node scripts/terrain-sgm-compare.mjs --dataset s2p-triplet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-sgm-comparison
          path: |
            test-results/terrain-sgm/index.html
            test-results/terrain-sgm/comparison.json
            test-results/terrain-sgm/*/report.json
            test-results/terrain-sgm/*/terrain.html

  terrain-sgm-large-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compare native SGM to previous matcher on 128x128 actual satellite stereo
        run: node scripts/terrain-sgm-compare.mjs --dataset s2p-triplet --size 128 --out test-results/terrain-sgm-large
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-sgm-large-comparison
          path: |
            test-results/terrain-sgm-large/index.html
            test-results/terrain-sgm-large/comparison.json
            test-results/terrain-sgm-large/*/report.json

  terrain-sgm-halo-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compare 128x128 stereo with and without 4-pixel SGM tile overlap
        run: node scripts/terrain-sgm-compare.mjs --dataset s2p-triplet --size 128 --tile-halo 4 --out test-results/terrain-sgm-halo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-sgm-halo-compare
          path: |
            test-results/terrain-sgm-halo/index.html
            test-results/terrain-sgm-halo/comparison.json
            test-results/terrain-sgm-halo/*/report.json

  terrain-sgm-pyramid-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compare two-resolution native SGM with original SGM on 128x128 real triplet
        run: node scripts/terrain-sgm-compare.mjs --dataset s2p-triplet --size 128 --sgm-pyramid-levels 2 --out test-results/terrain-sgm-pyramid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-sgm-pyramid-compare
          path: |
            test-results/terrain-sgm-pyramid/index.html
            test-results/terrain-sgm-pyramid/comparison.json
            test-results/terrain-sgm-pyramid/*/report.json
