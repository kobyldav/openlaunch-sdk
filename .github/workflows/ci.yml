name: CI

on:
  push:
    branches: ["main", "master", "feature/terrain-reconstruction"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate npm release graph without publishing
        run: node scripts/release-npm.mjs --plan
      - run: npm run check
      - name: Audit all public runtime exports and examples
        run: node scripts/api-surface-audit.mjs --output=test-results/ci-api
      - name: Preserve API coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory-node-${{ matrix.node }}
          path: test-results/ci-api
      - name: Execute all catalogued offline TypeScript examples
        run: node scripts/verify-cookbook.mjs --mode=offline --output=test-results/ci-cookbook
      - run: npm pack --dry-run
      - run: npm run pack:check:packages
      - run: npm run test:packed

  terrain-demo-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run example:terrain
      - run: node scripts/terrain-source-demo.mjs --source aerial
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-demo-windows
          path: |
            test-results/terrain-demo/
            test-results/terrain-aerial/
            test-results/terrain-sources.html

  terrain-real-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run example:terrain-real -- --size 32
      - name: Higher density stereo check (same 960 m area)
        run: node scripts/terrain-real-demo.mjs --size 64 --resolution 15 --out test-results/terrain-real-detail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-real-windows
          path: |
            test-results/terrain-real/report.json
            test-results/terrain-real/terrain.html
            test-results/terrain-real/terrain.obj
            test-results/terrain-real/heights.csv
            test-results/terrain-real-detail/report.json
            test-results/terrain-real-detail/terrain.html
