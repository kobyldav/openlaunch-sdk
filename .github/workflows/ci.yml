name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Execute all catalogued offline TypeScript examples
        run: node scripts/verify-cookbook.mjs --mode=offline --output=test-results/ci-cookbook
      - run: npm pack --dry-run
      - run: npm run pack:check:packages
      - run: npm run test:packed
