name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate npm release graph without publishing
        run: node scripts/release-npm.mjs --plan
      - run: npm run check
      - name: Audit all public runtime exports and examples
        run: node scripts/api-surface-audit.mjs --output=test-results/ci-api
      - name: Preserve API coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory-node-${{ matrix.node }}
          path: test-results/ci-api
      - name: Execute all catalogued offline TypeScript examples
        run: node scripts/verify-cookbook.mjs --mode=offline --output=test-results/ci-cookbook
      - run: npm pack --dry-run
      - run: npm run pack:check:packages
      - run: npm run test:packed
